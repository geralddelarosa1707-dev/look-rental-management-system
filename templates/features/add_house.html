<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Add House</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
  </head>
  <body>
    <header>
      <h2>Add House</h2>
      <nav>
        <a href="{{ url_for('home') }}">Home</a> | 
        <a href="{{ url_for('houses') }}">Houses</a> |
        <a href="{{ url_for('rent_house') }}">Rent House</a> | 
        <a href="{{ url_for('add_house') }}">Add House</a> |
        <a href="{{ url_for('rental_history') }}">Rental History</a> |
        <a href="{{ url_for('update_house') }}">Update House</a>
      </nav>
    </header>
    <main>
      
      {% if message %}
        <p>{{ message }}</p>
      {% endif %}
      
      <form method="POST" action="{{ url_for('add_house') }}">
        <fieldset>
          <legend><h4>House Information</h4></legend>
          <label for="owner_name">Owner Name</label>
          <input type="text" id="owner_name" name="owner_name" value="{{ form_data.get('owner_name', '') }}" placeholder="Enter Owner Name" required>
          <label for="house_name">House Name</label>
          <input type="text" id="house_name" name="house_name" value="{{ form_data.get('house_name', '') }}" placeholder="Enter House Name" required>
          <label for="house_address">House Address</label>
          <input type="text" id="house_address" name="house_address" value="{{ form_data.get('house_address', '') }}" placeholder="Enter House Address" required>
          <label for="monthly_rent">Monthly Rent</label>
          <input type="number" id="monthly_rent" name="monthly_rent" value="{{ form_data.get('monthly_rent', '') }}" step="0.01" placeholder="Enter Monthly Rent" required>
          <label for="bedrooms">No. of Bedrooms</label>
          <input type="number" id="bedrooms" name="bedrooms" value="{{ form_data.get('bedrooms', '') }}" placeholder="Enter No. of Bedrooms" required>
          <label for="bathrooms">No. of Bathrooms</label>
          <input type="number" id="bathrooms" name="bathrooms" value="{{ form_data.get('bathrooms', '') }}" placeholder="Enter No. of Bathrooms" required>
          <label for="house_type">House Type</label>
          <input type="text" id="house_type" name="house_type" value="{{ form_data.get('house_type', '') }}" placeholder="Enter House Type" required>
        </fieldset>
        <button type="submit">Add House</button>
      </form>
    </main>
  </body>
</html>
