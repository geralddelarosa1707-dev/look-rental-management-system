<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Rent House</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
  </head>
  <body>
    <header>
      <h2>Rent House</h2>
      <nav>
        <a href="{{ url_for('home') }}">Home</a> |
        <a href="{{ url_for('houses') }}">Houses</a> |
        <a href="{{ url_for('rent_house') }}">Rent House</a> | 
        <a href="{{ url_for('add_house') }}">Add House</a> |
        <a href="{{ url_for('rental_history') }}">Rental History</a> |
        <a href="{{ url_for('update_house') }}">Update House</a>
      </nav>
    </header>
    <main>
      
      {% if message %}
        <p>{{ message }}</p>
      {% endif %}
      
      <form method="POST" action="{{ url_for('rent_house') }}">
        <fieldset>
          <legend><h4>Rental Information</h4></legend>
          <label for="house_id">House ID</label>
          <input type="text" id="house_id" name="house_id" value="{{ form_data.get('house_id', '') }}" placeholder="Enter house ID" required>
          <label for="renter_name">Renter Name</label>
          <input type="text" id="renter_name" name="renter_name" value="{{ form_data.get('renter_name', '') }}" placeholder="Enter your Name" required>
          <label for="contact_num">Contact Number</label>
          <input type="text" id="contact_num" name="contact_num" value="{{ form_data.get('contact_num', '') }}" placeholder="Enter your Contact Number" required>
          <label for="rent_duration">Rental Duration</label>
          <input type="number" id="rent_duration" name="rent_duration" value="{{ form_data.get('rental_duration', '') }}" placeholder="Enter Rental Duration" required>
        </fieldset>
        <button type="submit">Submit Rental</button>
      </form>
    </main>
  </body>
</html>
