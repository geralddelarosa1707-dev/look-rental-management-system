<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
  </head>
  <body>
    <header>
      <h2>Signup</h2>
      <nav>
        <a href="{{ url_for('home') }}">Home</a> | 
        <a href="{{ url_for('houses') }}">Houses</a> |
        <a href="{{ url_for('rent_house') }}">Rent House</a> | 
        <a href="{{ url_for('add_house') }}">Add House</a> |
        <a href="{{ url_for('rental_history') }}">Rental History</a> |
        <a href="{{ url_for('update_house') }}">Update House</a> |
        <a href="{{ url_for('login') }}">Login/Signup</a>
      </nav>
    </header>
    <main>

      {% if message %}
        <p>{{ message }}</p>
      {% endif %}

      <form method="POST" action="{{ url_for('create_user') }}" onsubmit="return confirm('Confirm password?');">
        <fieldset>
          <legend>Signup</legend>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password" required>
        </fieldset>
        <button type="submit">Signup</button>
      </form>
    </main>
  </body>
</html>
